<!doctype html><html lang="ru"><head><meta name="ms-sp-authoring-source" content="agent"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>English Practice</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172033;background:#eef3f8}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}.head{padding:20px;background:linear-gradient(120deg,#2563eb,#7c3aed);color:#fff}.head h1{margin:0}.tabs{display:flex;position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;z-index:4}.tabs button{flex:1;padding:14px 8px;border:0;background:#fff;font-weight:700}.tabs .on{color:#2563eb;border-bottom:3px solid #2563eb}.page{display:none;padding:16px}.page.on{display:block}.field,button,select{font:inherit}.field{width:100%;padding:12px;border:1px solid #ccd5e1;border-radius:12px;margin:5px 0 10px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.primary{background:#2563eb;color:white}.soft{background:#edf2f7}.messages{height:52vh;min-height:300px;overflow:auto;border:1px solid #d9e0e8;border-radius:15px;padding:12px;display:flex;flex-direction:column;gap:10px}.bubble{padding:10px 12px;border-radius:14px;max-width:86%}.me{align-self:flex-end;background:#2563eb;color:#fff}.bot{background:#edf2f7}.row{display:flex;gap:8px}.row .field{margin:0}.word{padding:12px;border-bottom:1px solid #e4e8ee;display:flex;justify-content:space-between;gap:8px}.muted{color:#657187;font-size:14px}.card{height:300px;border-radius:22px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.card .big{font-size:36px;font-weight:800}.stats{display:flex;justify-content:space-between;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{padding:11px;background:#f3f6fa;border-radius:12px;font-size:13px;margin-bottom:12px}@media(prefers-color-scheme:dark){:root{background:#08111f;color:#e7edf7}.app,.tabs,.tabs button{background:#101827;color:#e7edf7}.field{background:#101827;color:#fff;border-color:#354258}.bot,.soft{background:#253044;color:#fff}.messages{border-color:#354258}.note{background:#1b2638}.word{border-color:#39465b}}
</style></head><body><div class="app"><div class="head"><h1>English Practice</h1><div>Мобильный тренажёр английского</div></div><div class="tabs"><button class="on" data-p="chat">💬 Чат</button><button data-p="words">📚 Словарь</button><button data-p="learn">🎓 Карточки</button></div>
<section id="chat" class="page on"><label>Тема</label><select id="topic" class="field"><option>Work</option><option>Laboratory</option><option>Travel</option><option>Daily life</option></select><div id="messages" class="messages"></div><form id="chatForm" class="row" style="margin-top:10px"><input id="msg" class="field" placeholder="Write in English..." autocomplete="off"><button class="primary">➤</button></form></section>
<section id="words" class="page"><div class="note">В обычном браузере слова и результат обучения сохраняются в localStorage. В изолированном предпросмотре данные доступны до закрытия страницы.</div><form id="wordForm"><input id="en" class="field" placeholder="English word" required><input id="tr" class="field" placeholder="Transcription, e.g. /ˈsɑːmpəl/"><input id="ru" class="field" placeholder="Русский перевод" required><button class="primary" style="width:100%">Добавить карточку</button></form><div style="margin:14px 0"><label><b>Импорт словаря CSV</b></label><input id="csv" type="file" accept=".csv,text/csv" class="field"><div class="muted">Строка: English;Transcription;Russian</div></div><h3>Мой словарь: <span id="count"></span></h3><div id="list"></div><button id="reset" class="soft" style="margin-top:15px">Сбросить прогресс обучения</button></section>
<section id="learn" class="page"><div class="stats"><b id="progress"></b><span id="score"></span></div><div id="card" class="card"><div><div id="cardEn" class="big"></div><div id="cardTr"></div><div id="cardRu" style="display:none;margin-top:35px;font-size:28px;font-weight:800"></div><div id="hint" style="margin-top:35px;font-size:13px">Нажми на карточку, чтобы увидеть перевод</div></div></div><div class="grid" style="margin-top:12px"><button id="again" class="soft">🔁 Повторить</button><button id="know" class="primary">✓ Знаю</button></div><button id="newRound" class="soft" style="width:100%;margin-top:10px">Начать новый раунд</button></section></div>
<script>
(()=>{const K='englishPracticeV2';const defaults=[{en:'laboratory',tr:'/ləˈbɒrətri/',ru:'лаборатория',ok:0,bad:0},{en:'sample',tr:'/ˈsɑːmpəl/',ru:'образец',ok:0,bad:0},{en:'result',tr:'/rɪˈzʌlt/',ru:'результат',ok:0,bad:0}];let storage=null;try{storage=window.localStorage}catch(e){}let s;try{s=storage?JSON.parse(storage.getItem(K)):null}catch(e){}if(!s||!Array.isArray(s.words))s={words:defaults,known:0,seen:0};const save=()=>{try{if(storage)storage.setItem(K,JSON.stringify(s))}catch(e){}};save();const $=x=>document.querySelector(x),$$=x=>[...document.querySelectorAll(x)];$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.p).classList.add('on');if(b.dataset.p==='learn')start(false)});
const messages=$('#messages');function add(t,c){let d=document.createElement('div');d.className='bubble '+c;d.textContent=t;messages.append(d);messages.scrollTop=messages.scrollHeight}function greet(){messages.innerHTML='';let t=$('#topic').value, q={Work:'What is the most interesting part of your job?',Laboratory:'What laboratory equipment do you work with?',Travel:'Where would you like to travel?', 'Daily life':'How was your day?'}[t];add(q,'bot')}$('#topic').onchange=greet;greet();$('#chatForm').onsubmit=e=>{e.preventDefault();let v=$('#msg').value.trim();if(!v)return;add(v,'me');$('#msg').value='';let corr=/\bi am work\b/i.test(v)?'Small correction: use “I work” or “I am working”.\n\n':'';let r={Work:'What skills do you use most often?',Laboratory:'Can you describe a typical laboratory workflow?',Travel:'What would you like to do there?', 'Daily life':'What was the best part of your day?'}[$('#topic').value];setTimeout(()=>add(corr+r,'bot'),180)};
function render(){let l=$('#list');l.innerHTML='';$('#count').textContent=s.words.length;s.words.forEach((w,i)=>{let d=document.createElement('div');d.className='word';let a=document.createElement('div');a.innerHTML='<b></b><div class="muted"></div>';a.querySelector('b').textContent=w.en;a.querySelector('.muted').textContent=(w.tr||'')+' · '+w.ru+' · ✓ '+(w.ok||0)+' / ↻ '+(w.bad||0);let x=document.createElement('button');x.className='soft';x.textContent='Удалить';x.onclick=()=>{s.words.splice(i,1);save();render()};d.append(a,x);l.append(d)})}render();$('#wordForm').onsubmit=e=>{e.preventDefault();s.words.push({en:$('#en').value.trim(),tr:$('#tr').value.trim(),ru:$('#ru').value.trim(),ok:0,bad:0});save();e.target.reset();render()};$('#csv').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{String(r.result).split(/\r?\n/).forEach(line=>{let p=line.split(';');if(p.length>=3&&p[0].trim()&&p[2].trim())s.words.push({en:p[0].trim(),tr:p[1].trim(),ru:p.slice(2).join(';').trim(),ok:0,bad:0})});save();render();e.target.value=''};r.readAsText(f)};
let deck=[],idx=0,flipped=false;function start(reset){if(!s.words.length){$('#cardEn').textContent='Словарь пуст';$('#cardTr').textContent='Добавьте слова';$('#cardRu').style.display='none';return}if(reset||!deck.length||idx>=deck.length){deck=s.words.map((w,i)=>({w,i})).sort((a,b)=>(b.w.bad||0)-(a.w.bad||0)||Math.random()-.5);idx=0}show()}function show(){if(!deck.length)return;let z=deck[idx];flipped=false;$('#cardEn').textContent=z.w.en;$('#cardTr').textContent=z.w.tr||'';$('#cardRu').textContent=z.w.ru;$('#cardRu').style.display='none';$('#hint').style.display='block';$('#progress').textContent='Карточка '+(idx+1)+' из '+deck.length;$('#score').textContent='Всего: ✓ '+s.known+' из '+s.seen}$('#card').onclick=()=>{flipped=!flipped;$('#cardRu').style.display=flipped?'block':'none';$('#hint').style.display=flipped?'none':'block'};function mark(ok){if(!deck.length)return;let z=deck[idx];s.seen++;if(ok){s.known++;z.w.ok=(z.w.ok||0)+1}else{z.w.bad=(z.w.bad||0)+1;deck.push(z)}save();render();idx++;if(idx>=deck.length){$('#cardEn').textContent='Раунд завершён';$('#cardTr').textContent='Прогресс сохранён';$('#cardRu').style.display='none';$('#hint').style.display='none';$('#progress').textContent='Готово';$('#score').textContent='Всего: ✓ '+s.known+' из '+s.seen}else show()}$('#know').onclick=()=>mark(true);$('#again').onclick=()=>mark(false);$('#newRound').onclick=()=>start(true);$('#reset').onclick=()=>{if(confirm('Сбросить статистику обучения?')){s.known=0;s.seen=0;s.words.forEach(w=>{w.ok=0;w.bad=0});save();render();alert('Прогресс сброшен')}};
})();
</script></body></html>
